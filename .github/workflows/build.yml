name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project AudiobookPlayer.xcodeproj \
            -target AudiobookPlayer \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/AudiobookPlayer.app Payload/
          zip -r AudiobookPlayer.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudiobookPlayer-ipa
          path: AudiobookPlayer.ipa
